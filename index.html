*{box-sizing:border-box}body{margin:0;background:#f2f4ef;color:#172b27;font:16px system-ui,sans-serif}header{background:#172b27;color:white;padding:24px 18px}header h1{margin:4px 0;font-size:28px}small,.muted{color:#64736c}header small{color:#b8d8bd}main{max-width:760px;margin:auto;padding:16px 14px 100px}nav{display:flex;position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #d8dfd8;justify-content:center}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#dfe9df;color:#172b27;padding:11px 14px;font-weight:650}button.active,.primary{background:#245b46;color:white}nav button{border-radius:0;background:white;flex:1;max-width:180px;font-size:14px}section,.card{background:white;border:1px solid #dce3db;border-radius:16px;padding:16px;margin:12px 0}h2,h3,p{margin:0 0 10px}h3{font-size:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}.days button{padding:10px 2px;font-size:13px}.sets{display:grid;grid-template-columns:36px 1fr 1fr 45px;gap:7px;align-items:center;margin:7px 0}input,select,textarea{min-width:0;width:100%;padding:10px;border:1px solid #cbd6cd;border-radius:8px;background:#fafcf9;color:#172b27}input[type=checkbox]{width:24px;height:24px;accent-color:#245b46}label{display:block;font-size:13px;color:#53665b;margin:8px 0 4px}.pill{display:inline-block;background:#e5efdf;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#e8eee5;padding:12px;border-radius:12px}.metric b{display:block;font-size:25px}.bar{height:8px;background:#dfe6dc;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#397b59}textarea{resize:vertical} .timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700} .warn{background:#fff2dc} .hidden{display:none} a{color:#245b46} @media(min-width:600px){main{padding:20px 20px 100px}}
</style></head><body><header><small>TRAINING JOURNAL / 12 WEEKS</small><h1>PROJECT STRONG 2.0</h1><div>Strength &amp; endurance</div></header><nav id="nav"></nav><main id="main"></main><script>

const P=[[

[E('Barbell back squat',4,'5–6',150),E('Barbell Romanian deadlift',3,'8',120),E('Bulgarian split squat',3,'8/leg',90),E('Seated hamstring curl',3,'10–12'),E('Standing calf raise',3,'15',45),E('Sled push',3,'20 m',60,'Optional finisher'),E('Kettlebell swing',3,'12',60,'Optional finisher')],
[E('Incline dumbbell press',3,'12',45),E('Single-arm dumbbell row',3,'10/side',45),E('Dumbbell lateral raise',3,'15',45),E('Hammer curl to press',3,'10',45)],
[E('Barbell bench press',4,'5–6',150),E('Assisted pull-up',4,'6–8',90),E('Seated DB shoulder press',3,'8–10',90),E('Chest-supported row',3,'10'),E('Cable lateral raise',3,'12',45,'Superset with pushdown'),E('Rope triceps pushdown',3,'12',45),E('Battle ropes',3,'30 sec',30,'Optional finisher')],[],
[E('Trap bar deadlift',4,'5',150),E('Barbell hip thrust',3,'8',120),E('Single-arm landmine press',3,'10/side'),E('Neutral-grip lat pulldown',3,'10'),E('Cable Pallof press',3,'12/side',45),E('Heavy farmer carry',3,'40 sec')],[]], [
[E('Dumbbell dead bug',3,'10/side',30),E('Bear plank shoulder tap',3,'12/side',30),E('Weighted Russian twist',3,'20 total',30),E('Suitcase march',3,'30 sec/side',30)],
[E('Low box jump or explosive step-up',3,'5'),E('Barbell back squat',4,'4–5',150),E('Barbell Romanian deadlift',3,'6–8',120),E('Single-leg leg press',3,'10/leg',75),E('Lying hamstring curl',3,'10',60,'Final set: optional 25% drop, 6–10 reps'),E('Standing calf raise',3,'12–15',45)],
[E('Dumbbell floor press',3,'12',45),E('Chest-supported dumbbell row',3,'12',45),E('Arnold press',3,'10',45),E('Overhead triceps extension',3,'12',45)],
[E('Barbell bench press',4,'4–6',150),E('Assisted pull-up',4,'6',90),E('Standing landmine press',3,'8/side',75),E('Single-arm cable row',3,'10/side'),E('Cable lateral raise',3,'12–15',45,'Superset with curl'),E('Cable biceps curl',3,'12',45),E('Rowing intervals',4,'30 sec hard',90,'Optional: 60 sec easy between efforts')],[],
[E('Trap bar deadlift',4,'4–5',150),E('Barbell hip thrust',4,'6',120),E('Incline dumbbell press',3,'8',75),E('T-bar row',3,'8–10',75),E('Cable woodchop',3,'10/side',45),E('Sled push',3,'20 m',75,'Optional circuit'),E('Heavy farmer carry',3,'30 m',75,'Optional circuit'),E('Medicine ball slam',3,'10',75,'Optional circuit')],[]], [
[E('Plank dumbbell pull-through',3,'10/side',30),E('Side plank hip dip',3,'12/side',30),E('Reverse crunch',3,'15',30),E('Hollow body hold or dead bug',3,'30 sec',30)],
[E('Barbell back squat',1,'3–5',180,'Top set'),E('Barbell back squat',3,'6',120,'Back-off: 10–15% lighter'),E('Barbell Romanian deadlift',3,'6',120),E('Hack squat',3,'8–10',90),E('Seated hamstring curl',3,'12'),E('Single-leg calf raise',3,'12/leg',45),E('Sled push',3,'30 sec',60,'Optional finisher')],
[E('Dumbbell push press',3,'8',45),E('Renegade row',3,'8/side',45),E('Incline dumbbell press',3,'12',45),E('Lateral raise',3,'15',45),E('Alternating hammer curl',3,'10/side',45)],
[E('Barbell bench press',1,'3–5',180,'Top set'),E('Barbell bench press',3,'6–8',120,'Back-off'),E('Assisted pull-up',4,'5–6',90),E('Dumbbell shoulder press',3,'6–8',90),E('Chest-supported row',3,'8–10',75),E('Cable face pull',3,'15',45,'Superset with extension'),E('Rope triceps extension',3,'12',45),E('Heavy farmer carry',2,'45 sec',60,'Optional challenge')],[],
[E('Trap bar deadlift',1,'3–5',180,'Top set'),E('Trap bar deadlift',2,'5',120,'Back-off'),E('Barbell hip thrust',4,'5–6',120),E('Single-arm landmine press',3,'8/side',75),E('Weighted step-up',2,'8/leg',75),E('Lat pulldown',3,'8'),E('Hanging knee raise',3,'12',45),E('SkiErg',3,'150 m',60,'Optional circuit'),E('Kettlebell swing',3,'15',60,'Optional circuit'),E('Heavy farmer carry',3,'30 m',60,'Optional circuit')],[]]];
const miles=[4,4.5,5,4,5.5,6,6.5,5,7,7.5,8,8.5],types=['Intervals','Speed intervals','Tempo','Easy + strides','Intervals','HIIT run','Tempo','Easy + strides','Progression','Intervals','Tempo','Easy + strides'],focus=['Establish working weights; 2–3 reps in reserve','Add reps or small load','Strongest working sets','Deload: 30–40% fewer sets','Establish heavier working weights','Increase load where ready','Controlled rep PRs','Deload: 30–40% fewer sets','Establish top-set benchmarks','Increase weight or reps','Squat and bench rep PRs','Reduce accessories 30–40%; optional recovered PR'];
const names=['Speed & Core','Lower Body Power','Hybrid Training','Upper Body Strength','Endurance Run','Full-Body Performance','Hot Yoga'],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let db;try{db=JSON.parse(localStorage.getItem('strong2-v1'))||{}}catch{db={}};db.logs??={};db.checks??={};let w=db.week||1,d=db.day||0,tab='Today',timer=null,end=0;const save=()=>{try{localStorage.setItem('strong2-v1',JSON.stringify(db))}catch(e){alert('Storage unavailable. Export your data before closing.')}};const key=()=>`${w}-${d}`;const log=()=>db.logs[key()]??={sets:{}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const phase=()=>Math.floor((w-1)/4);const exercises=()=>P[phase()][d].map((e,i)=>({...e,sets:(w===4||w===8)?Math.max(1,Math.round(e.sets*.65)):w===12&&i>2?Math.max(1,Math.round(e.sets*.65)):e.sets}));
function field(k,v){log()[k]=v;save()}function setval(i,j,k,v){let a=log().sets[`${i}-${j}`]??={};a[k]=v;save()}function choose(a,b){w=a;d=b;db.week=w;db.day=d;save();render()}function startTimer(s){end=Date.now()+s*1000;clearInterval(timer);tick();timer=setInterval(tick,250)}function tick(){let n=Math.max(0,Math.ceil((end-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(!n)clearInterval(timer)}
function previous(name){let best='';for(let a=1;a<=12;a++)for(let b=0;b<7;b++){if(a*7+b>=w*7+d)continue;let l=db.logs[`${a}-${b}`];if(!l)continue;P[Math.floor((a-1)/4)][b].forEach((e,i)=>{if(e.name===name)for(let j=0;j<e.sets;j++){let s=l.sets?.[`${i}-${j}`];if(s?.done&&s.weight!==undefined&&s.reps)best=`${s.weight} lb × ${s.reps} (W${a})`}})}return best}
function render(){document.getElementById('nav').innerHTML=['Today','Progress','History','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let m=document.getElementById('main');if(tab==='Today'){let l=log(),run=[0,2,4].includes(d);m.innerHTML=`<div class="row between"><div><span class="pill">${['BUILD','POWER','PERFORM'][phase()]}</span><h2>Week ${w} / 12</h2></div><select style="width:120px" onchange="choose(+this.value,d)">${Array.from({length:12},(_,i)=>`<option ${w===i+1?'selected':''} value="${i+1}">Week ${i+1}</option>`).join('')}</select></div><div class="days">${days.map((x,i)=>`<button class="${d===i?'active':''}" onclick="choose(w,${i})">${x}${db.logs[`${w}-${i}`]?.complete?' ✓':''}</button>`).join('')}</div><section><h2>${names[d]}</h2><p class="muted">${[1,3,5].includes(d)?'Gym · 45–60 min':d===4?'Outdoor or treadmill · flexible':d===6?'Recovery':'Home · 30–40 min'}</p><p>${focus[w-1]}</p>${[1,3,5].includes(d)?'<p>Warm up 5–8 min. Skip optional finishers if fatigued or short on time.</p>':''}${d===5?'<p>After Friday’s long run, reduce lower-body load or sets if needed; no fatigued PR attempts.</p>':''}</section>${run?`<section><h3>${d===0?types[w-1]+' · 20–30 min':d===2?'Easy / recovery · 20–25 min': 'Easy long run · '+(w===12?'8–9':miles[w-1])+' miles'}</h3><div class="metrics"><div><label>Miles</label><input type="number" min="0" step="0.01" value="${esc(l.miles)}" onchange="field('miles',this.value)"></div><div><label>Minutes</label><input type="number" min="0" step="0.1" value="${esc(l.minutes)}" onchange="field('minutes',this.value)"></div></div><p class="muted">Repeat distances if recovery is poor.</p></section>`:''}${d===6?'<section>Hot yoga only. Hydrate and replenish electrolytes; choose gentler effort if tired.</section>':''}${[0,2].includes(d)?'<p class="muted">Circuit: complete one set of each exercise before repeating. Rest between rounds.</p>':''}${exercises().length?'<div class="row between"><b>Rest timer</b><span class="timer" id="timer">0:00</span><button onclick="startTimer(0)">Reset</button></div>':''}${exercises().map((e,i)=>`<section><div class="row between"><h3>${esc(e.name)}</h3><button onclick="startTimer(${e.rest})">${e.rest}s rest</button></div><p><b>${e.sets} × ${e.reps}</b> ${esc(e.note)}</p><small>${esc(previous(e.name))}</small><div class="sets muted"><span>Set</span><span>Load lb</span><span>Reps / sec / m</span><span>Done</span></div>${Array.from({length:e.sets},(_,j)=>{let s=l.sets[`${i}-${j}`]||{};return `<div class="sets"><b>${j+1}</b><input aria-label="Set ${j+1} load" type="number" min="0" step="0.5" value="${esc(s.weight)}" onchange="setval(${i},${j},'weight',this.value)"><input aria-label="Set ${j+1} reps or duration" type="number" min="0" step="1" value="${esc(s.reps)}" onchange="setval(${i},${j},'reps',this.value)"><input aria-label="Set ${j+1} complete" type="checkbox" ${s.done?'checked':''} onchange="setval(${i},${j},'done',this.checked)"></div>`}).join('')}</section>`).join('')}<section><h3>Session notes</h3><label>Energy (1–5)</label><input type="number" min="1" max="5" value="${esc(l.energy)}" onchange="field('energy',this.value)"><label>Soreness (1–5)</label><input type="number" min="1" max="5" value="${esc(l.sore)}" onchange="field('sore',this.value)"><label>Sleep hours</label><input type="number" min="0" max="24" step="0.5" value="${esc(l.sleep)}" onchange="field('sleep',this.value)"><button onclick="readiness()">Check readiness</button><p id="ready"></p><label>Notes</label><textarea onchange="field('notes',this.value)">${esc(l.notes)}</textarea><button class="primary" style="width:100%;margin-top:12px" onclick="field('complete',!log().complete);render()">${l.complete?'✓ Completed — undo':'Mark session complete'}</button></section>`;tick()}else if(tab==='Progress'){let all=Object.entries(db.logs),done=all.filter(([k,l])=>l.complete).length,total=all.reduce((s,[k,l])=>s+(+l.miles||0),0),prs={};all.forEach(([k,l])=>{let [a,b]=k.split('-').map(Number);P[Math.floor((a-1)/4)][b].forEach((e,i)=>{if(!/squat|deadlift|bench press|hip thrust|lat pulldown/i.test(e.name))return;for(let j=0;j<e.sets;j++){let s=l.sets?.[`${i}-${j}`];if(s?.done&&+s.weight>0&&+s.reps>=1&&+s.reps<=12){let est=+s.weight*(1+ +s.reps/30);if(!prs[e.name]||est>prs[e.name].est)prs[e.name]={est,weight:s.weight,reps:s.reps}}}})});let c=db.checks[w]||{};m.innerHTML=`<h2>Progress</h2><div class="metrics"><div class="metric">Sessions<b>${done}/84</b></div><div class="metric">Miles logged<b>${total.toFixed(1)}</b></div></div><section><h3>Weekly mileage</h3>${miles.map((target,i)=>{let n=[0,2,4].reduce((s,b)=>s+(+db.logs[`${i+1}-${b}`]?.miles||0),0);return `<p>W${i+1} · ${n.toFixed(1)} mi total · long-run target ${i===11?'8–9':target} mi</p><div class="bar"><i style="width:${Math.min(100,n/20*100)}%"></i></div>`}).join('')}</section><section><h3>Strength PRs</h3><small>Best estimated 1RM from completed sets, same exercise only.</small>${Object.entries(prs).map(([n,s])=>`<p style="margin-top:12px"><b>${esc(n)}</b><br>${s.weight} lb × ${s.reps} · est. ${s.est.toFixed(1)} lb</p>`).join('')||'<p>Log completed lifting sets to see PRs.</p>'}</section><section><h3>Weekly maintenance check-in</h3><select onchange="choose(+this.value,d)">${miles.map((_,i)=>`<option value="${i+1}" ${w===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select>${[['weight','Average weight (lb)'],['protein','Average protein (g/day)'],['sleep','Average sleep (hours)']].map(([k,n])=>`<label>${n}</label><input type="number" step="0.1" value="${esc(c[k])}" onchange="check('${k}',this.value)">`).join('')}<label>Wins / recovery</label><textarea onchange="check('notes',this.value)">${esc(c.notes)}</textarea><p>Weight history: ${Object.entries(db.checks).filter(([k,v])=>v.weight).map(([k,v])=>`W${k}: ${esc(v.weight)} lb`).join(' · ')||'No entries'}</p></section>`}else if(tab==='History'){m.innerHTML='<h2>Training history</h2>'+Object.entries(db.logs).filter(([k,l])=>l.complete||l.miles||Object.keys(l.sets||{}).length).sort((a,b)=>{let [x,y]=a[0].split('-').map(Number),[z,q]=b[0].split('-').map(Number);return z*7+q-x*7-y}).map(([k,l])=>{let [a,b]=k.split('-').map(Number);return `<section><div class="row between"><b>Week ${a} · ${days[b]}</b><button onclick="tab='Today';choose(${a},${b})">Open</button></div><p>${names[b]} ${l.complete?'✓':''}</p><small>${l.miles?esc(l.miles)+' mi · ':''}${l.miles&&l.minutes?(+l.minutes/+l.miles).toFixed(2)+' min/mi · ':''}${Object.values(l.sets||{}).filter(s=>s.done).length} sets completed</small></section>`}).join('')}else{m.innerHTML=`<h2>Settings & data</h2><section><h3>Back up your training</h3><p>Logs are stored on this device and browser only. Export regularly, especially before switching devices.</p><div class="row"><button onclick="backup()">JSON backup</button><button onclick="csv()">CSV export</button></div><label>Restore JSON backup (replaces current logs)</label><input type="file" accept=".json,application/json" onchange="restore(this)"></section><section><h3>Training guidelines</h3><p>Keep most runs conversational. Use Monday as the only hard running day. Keep 2–3 reps in reserve most weeks. Use controlled rep PRs, not maximal singles. If pain, pelvic floor symptoms or persistent fatigue occur, stop or modify training.</p><p>Maintain weight, fuel runs and lifting, and discuss unintended weight loss or medication concerns with your prescriber.</p><p>Home screen: open the hosted app in Safari, tap Share, then Add to Home Screen.</p></section>`}}
function check(k,v){(db.checks[w]??={})[k]=v;save()}function readiness(){let l=log();document.getElementById('ready').textContent=(!l.energy||!l.sore||!l.sleep)?'Enter all three values.':+l.energy<=2||+l.sore>=4||+l.sleep<5?'Recovery day: reduce sets 30–50%, skip finishers.':+l.energy===3||+l.sore===3||+l.sleep<6.5?'Standard day: no PR attempts.':'Performance day: progress if technique and recovery are good.'}function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('strong2-backup.json',JSON.stringify(db,null,2),'application/json')}function csv(){let rows=[['week','day','exercise','set','load_lb','reps_or_duration','set_done','miles','minutes','session_done','notes']];Object.entries(db.logs).forEach(([k,l])=>{let [a,b]=k.split('-').map(Number);rows.push([a,days[b],names[b],'','','','',l.miles,l.minutes,l.complete,l.notes]);Object.entries(l.sets||{}).forEach(([ij,s])=>{let [i,j]=ij.split('-').map(Number);rows.push([a,days[b],P[Math.floor((a-1)/4)][b][i]?.name,j+1,s.weight,s.reps,s.done,'','','',''])})});download('strong2-log.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.logs||!x.checks||typeof x.logs!=='object')throw Error();if(confirm('Replace current training data?')){db=x;w=Math.max(1,Math.min(12,+db.week||1));d=Math.max(0,Math.min(6,+db.day||0));save();render()}}catch{alert('Invalid backup file')}}render();
</script></body></html>
